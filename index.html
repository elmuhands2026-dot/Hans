<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172b36">
  <title>مطابخ هانس | تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="مطابخ هانس">
      <img class="brand-image" src="images/hans.jpg" alt="" onerror="this.style.display='none'">
      <div class="brand-shade"></div>
      <div class="brand-copy">
        <span class="eyebrow">HANS KITCHENS</span>
        <h2>كل ما يخص المطبخ</h2>
        <p>جودة في التفاصيل، وأناقة في كل مساحة.</p>
      </div>
      <div class="brand-mark">HANS</div>
    </section>

    <section class="form-panel">
      <div class="mobile-brand">HANS <span>مطابخ هانس</span></div>
      <div class="form-heading">
        <span class="heading-line"></span>
        <p class="welcome">مرحباً بعودتك</p>
        <h1>تسجيل الدخول</h1>
        <p class="subheading">أدخل بيانات حسابك للمتابعة إلى النظام.</p>
      </div>

      <form id="loginForm" novalidate>
        <label class="field-label" for="username">اسم المستخدم</label>
        <div class="field-wrap">
          <span class="field-icon" aria-hidden="true">♙</span>
          <input id="username" name="username" class="input-field" type="text"
                 placeholder="أدخل اسم المستخدم" autocomplete="username"
                 required maxlength="80">
        </div>

        <label class="field-label password-label" for="password">كلمة المرور</label>
        <div class="field-wrap">
          <span class="field-icon" aria-hidden="true">⌑</span>
          <input id="password" name="password" class="input-field" type="password"
                 placeholder="أدخل كلمة المرور" autocomplete="current-password"
                 required maxlength="200">
          <button class="password-toggle" id="togglePassword" type="button"
                  aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
        </div>

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" id="rememberMe">
            <span>تذكرني على هذا الجهاز</span>
          </label>
          <button class="text-button" id="forgotPassword" type="button">نسيت كلمة المرور؟</button>
        </div>

        <button class="submit-button" id="submitButton" type="submit">
          <span class="button-label">تسجيل الدخول</span>
          <span class="button-arrow" aria-hidden="true">←</span>
        </button>
        <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
      </form>

      <div class="security-note">
        <span aria-hidden="true">▣</span>
        <span>اتصال آمن لإدارة حسابك</span>
      </div>
      <footer>© <span id="year"></span> مطابخ هانس. جميع الحقوق محفوظة.</footer>
    </section>
  </main>
</body>
</html>
